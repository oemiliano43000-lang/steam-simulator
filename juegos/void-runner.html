/* ================= SoundEngine (Web Audio pura) ================= */
class SoundEngine {
  constructor() { this.c = null; this.tempo = 118; this.target = 118; this.pm = 1; this.pmT = 1; this.step = 0; this.bar = 0; this.next = 0; this.tm = 0; this.lt = {}; this.mute = 0; }

  graze() { if (this.c && this.gate('g', 45)) this.tone('triangle', 2100, this.c.currentTime, .03, .016); }

const snd = new SoundEngine();

/* ================= Pools tipados (sin push/filter/splice en el bucle) ================= */
const pool = (n, f) => ({ n, f, a: new Float32Array(n * f), on: new Uint8Array(n), p: 0 });

function take(Q) { for (let i = 0; i < Q.n; i++) { const k = (Q.p + i) % Q.n; if (!Q.on[k]) { Q.on[k] = 1; Q.p = (k + 1) % Q.n; return k * Q.f; } } return -1; }
const eb = (x, y, a, s, col, acc) => { const o = take(EB); if (o < 0) return; const A = EB.a; A[o] = x; A[o + 1] = y; A[o + 2] = Math.cos(a) * s; A[o + 3] = Math.sin(a) * s; A[o + 4] = col; A[o + 5] = 0; A[o + 6] = acc || 0; };

function item(x, y, k) { const o = take(PW); if (o < 0) return; const A = PW.a; A[o] = x; A[o + 1] = y; A[o + 2] = 70; A[o + 3] = k; A[o + 4] = rnd() * 6; }

/* ================= Patrones paramétricos ================= */
function aimed(x, y, n, spread, sp, col) { const b = Math.atan2(R.y - y, R.x - x); for (let i = 0; i < n; i++) eb(x, y, b + (n > 1 ? (i / (n - 1) - .5) * spread : 0), sp, col); }
function ring(x, y, n, sp, off, col) { for (let i = 0; i < n; i++) eb(x, y, off + i * TAU / n, sp, col); }
// Espiral arquimediana: emisores simétricos y velocidad angular w; logarítmica: con aceleración exponencial
const spiral = (x, y, phi, arms, sp, col, acc) => { for (let k = 0; k < arms; k++) eb(x, y, phi + k * TAU / arms, sp, col & 1 ? 1 : (k & 1), acc); };
// Rosa polar: r(phi) = R0 + A cos(n phi)
const rose = (x, y, phi, R0, A, n, arms, col) => { const r = R0 + A * Math.cos(n * phi); for (let k = 0; k < arms; k++) eb(x, y, phi * 2 + k * TAU / arms, r, col); };

/* ================= Estado de partida ================= */
let R = { x: 240, y: 620, wave: 0, fr: 0, hs: 0, slow: 0 }, K = {}, L = levelDef(0); const B = { on: 0 }, Q4 = new Float32Array(4 * 130);

}

  L = levelDef(i); const sh = SH[P.ship], u = P.up; snd.start(); snd.setBoss(0); [PB, EB, PT, EN, AS, PW].forEach(clr); B.on = 0;
  R = { x: 240, y: 620, tx: 240, ty: 620, hp: sh.hp + u.arm, max: sh.hp + u.arm, score: 0, ks: 0, gz: 0, wave: i, t: 0, combo: 0, ct: 0, wp: 1, bombs: 1 + u.bomb, shield: u.shd >= 1 ? 1 : 0, inv: 1.5, fire: 0, fl: 0,
    skA: 0, skT: 0, skD: 1, hs: 0, vac: 0, en: 0, fr: 0, slow: 0, mt: 0, msg: '', bk: 0, qn: 0, qi: 0, wt: 0, gap: .6, dt: 0, ne: 0, na: 0, nb: 0, ab: 0, od: 0, ghost: 0, bar: 0, warp: 0, shdT: u.shd >= 3 ? 25 : 45, dfire: 0, wi: 0, hits: 0, bossDone: 0 };

function hangar(t) {
  if (t !== undefined) hTab = t; state = 'menu'; let body = ''; const lock = (tp, i) => `<span class="s">🔒 Nivel ${UNL[tp][i] || '?'}</span>`;
  const tabs = ['🚀 Naves', '🔫 Armas', '🎨 Skins', '⚙ Mejoras'].map((n, i) => `<button class="b3" style="${hTab === i ? 'background:#00ffff;color:#000' : ''}" onclick="hangar(${i})">${n}</button>`).join(' ');
  if (hTab === 0) body = SH.map((s, i) => `<div class="r ${P.ship === i ? 'on' : ''}"><img src="${shipIcon(i)}" width="44" height="44" alt=""><div style="flex:1"><b style="color:${s.col}">${s.n}</b> <span class="s">Vida ${s.hp} · Vel ${s.sp}x</span><br><span class="s">⚡ ${s.ab}: ${s.ad}</span></div>${P.owned[i] ? `<button class="b3" onclick="selShip(${i})">${P.ship === i ? 'EQUIPADA' : 'Equipar'}</button>` : lock('s', i)}</div>`).join('');
  else if (hTab === 1) body = WP.map((w, i) => `<div class="r ${P.wep === i ? 'on' : ''}"><div style="flex:1"><b style="color:${w.col}">${w.n}</b><br><span class="s">${w.d}</span></div>${P.ownedW[i] ? `<button class="b3" onclick="selWep(${i})">${P.wep === i ? 'EQUIPADA' : 'Equipar'}</button>` : lock('w', i)}</div>`).join('') + '<p class="s">Recoge los ítems W durante el nivel para subir el arma hasta el nivel 5.</p>';
  else if (hTab === 2) body = SKINS.map((k, i) => `<div class="r ${P.skin === i ? 'on' : ''}"><img src="${skinIcon(i)}" width="44" height="44" alt=""><div style="flex:1"><b style="color:${k.c || SH[P.ship].col}">${k.n}</b></div>${P.ownedK[i] ? `<button class="b3" onclick="selSkin(${i})">${P.skin === i ? 'EQUIPADA' : 'Equipar'}</button>` : lock('k', i)}</div>`).join('');
  else body = UPG.map(([k, n, d, mx, c]) => { const l = P.up[k], cost = c * (l + 1); return `<div class="r"><div style="flex:1"><b>${n}</b> <span class="s">${d}</span><br>${'■'.repeat(l) + '□'.repeat(mx - l)}</div>${l >= mx ? '<b class="y">MAX</b>' : `<button class="b3" onclick="buyUp('${k}',${cost})" ${P.credits < cost ? 'disabled' : ''}>${cost} 🪙</button>`}</div>`; }).join('');
  ui(`<h2>HANGAR</h2><p>Créditos: <b class="y">${P.credits}</b></p><div>${tabs}</div>${body}<p class="s">Naves, armas y skins se desbloquean completando niveles de la campaña.</p><button class="b2" onclick="menu()">← Volver</button>`);
}
function buyUp(k, c) { if (P.credits < c || P.up[k] >= MAX[k]) return; P.credits -= c; P.up[k]++; save(); hangar(); }
function selShip(i) { P.ship = i; save(); hangar(); }
function selWep(i) { P.wep = i; save(); hangar(); }
function selSkin(i) { P.skin = i; save(); hangar(); }
function pause() { if (state !== 'play') return; state = 'pause'; ui('<h2>PAUSA</h2><button class="b" onclick="resume()">▶ Continuar</button><button class="b2" onclick="endRun()">Abandonar partida</button>'); }
function resume() { state = 'play'; ui(''); last = performance.now(); }
function endRun() {
  state = 'over'; snd.stop(); const sc = Math.min(1e6, Math.floor(R.score)), cr = Math.floor(R.ks / 25) + Math.floor(R.gz / 200);
  P.credits += cr; if (sc > P.best) P.best = sc; P.runs++; send({ type: 'end', score: sc }); save();
  ui(`<h2>NIVEL FALLIDO</h2><p>${L.wd + 1}-${L.lv + 1} · Oleada <b>${R.wi}/${L.nw}</b> · Puntos <b>${sc}</b></p><p>+<b class="y">${cr}</b> créditos</p>
  <button class="b" onclick="startLevel(${L.i})">↻ REINTENTAR</button><button class="b2" onclick="campaign()">🗺 Mapa</button><button class="b2" onclick="hangar()">🛠 Hangar</button>`);
}

/* ================= Controles ================= */
const pt = e => { if (state !== 'play') return; const r = cv.getBoundingClientRect(); R.tx = (e.clientX - r.left) * W / r.width; R.ty = (e.clientY - r.top) * H / r.height - (e.pointerType === 'touch' ? 70 : 0); };
cv.addEventListener('pointermove', pt); cv.addEventListener('pointerdown', e => { snd.init(); pt(e); });
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; K[k] = true; snd.init();
  if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
  if (k === ' ' || k === 'b') bomb(); if (k === 'q' || k === 'e') ability(); if (k === 'm') snd.mute ^= 1; if (k === 'p') (state === 'play' ? pause() : state === 'pause' && resume());
  if (e.key === 'Escape') { if (state === 'play') pause(); else if (state === 'pause') resume(); else send({ type: 'close' }); }
});
addEventListener('keyup', e => { K[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
addEventListener('blur', () => pause());
menu(); requestAnimationFrame(loop);
</script>
</body>
</html>
