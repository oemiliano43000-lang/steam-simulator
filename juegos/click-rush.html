<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLICK RUSH</title>
<style>html,body{margin:0;height:100%;background:#0b1020;overflow:hidden;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;cursor:crosshair}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* =====================================================================
   PLANTILLA PARA JUEGOS DE AMIGOS — CÓMO FUNCIONA LA CONEXIÓN CON LA TIENDA
   ---------------------------------------------------------------------
   Tu juego es UN SOLO archivo .html. La tienda lo abre dentro de un
   marco aislado (iframe sandbox), así que:
     - NO uses localStorage / cookies (están bloqueados).
     - NO cargues scripts, imágenes ni fuentes de internet. Todo va dentro del archivo.
   Mensajes (postMessage):
     1) Al cargar, avisa:   parent.postMessage({type:'ready'}, '*')
     2) La tienda responde: {type:'init', player:'nombre', best: 123}
     3) Al terminar cada partida, manda tu puntaje (entero >= 0):
                            parent.postMessage({type:'end', score: 123}, '*')
        La tienda paga la recompensa, guarda el récord y lo sube al ranking.
   ===================================================================== */
const send = m => { try { parent.postMessage(m, '*'); } catch (e) {} };
let player = 'Jugador', best = 0;
addEventListener('message', e => { const d = e.data; if (d && d.type === 'init') { player = d.player; best = d.best; } });
send({ type: 'ready' });

/* ---------- Juego: CLICK RUSH (30 s, pulsa los círculos antes de que se encojan) ---------- */
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W, H, st = 'menu', t = 0, score = 0, combo = 0, targets = [], spawn = 0, last = performance.now(), pops = [];
function fit() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', fit); fit();

function start() { st = 'play'; t = 30; score = 0; combo = 0; targets = []; pops = []; spawn = 0; }
function end() { st = 'over'; send({ type: 'end', score: Math.floor(score) }); if (score > best) best = Math.floor(score); }

cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (st !== 'play') { start(); return; }
  const i = targets.findIndex(o => Math.hypot(o.x - x, o.y - y) < o.r);
  if (i < 0) { combo = 0; return; }
  const o = targets[i]; targets.splice(i, 1); combo++;
  const pts = Math.round(10 * (1 + Math.floor(combo / 5)) * (o.life / o.max + .5));
  score += pts; pops.push({ x: o.x, y: o.y, t: .6, s: '+' + pts });
});

function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (st === 'play') {
    t -= dt; spawn -= dt;
    if (spawn <= 0) { spawn = Math.max(.25, .7 - (30 - t) * .012); const R = 28 + Math.random() * 22, life = 1.4 + Math.random() * .6;
      targets.push({ x: R + Math.random() * (W - 2 * R), y: 70 + R + Math.random() * (H - 90 - 2 * R), r: R, life, max: life }); }
    targets.forEach(o => o.life -= dt);
    const n = targets.length; targets = targets.filter(o => o.life > 0); if (targets.length < n) combo = 0;
    pops.forEach(p => p.t -= dt); pops = pops.filter(p => p.t > 0);
    if (t <= 0) end();
  }
  g.fillStyle = '#0b1020'; g.fillRect(0, 0, W, H);
  targets.forEach(o => { const k = o.life / o.max; g.fillStyle = `hsl(${k * 120},80%,55%)`; g.beginPath(); g.arc(o.x, o.y, o.r * (.4 + .6 * k), 0, 6.3); g.fill();
    g.strokeStyle = '#fff'; g.lineWidth = 2; g.beginPath(); g.arc(o.x, o.y, o.r, 0, 6.3); g.stroke(); });
  g.fillStyle = '#ffd700'; g.font = 'bold 20px Arial'; g.textAlign = 'center'; pops.forEach(p => g.fillText(p.s, p.x, p.y - (.6 - p.t) * 40));
  g.fillStyle = '#fff'; g.textAlign = 'left'; g.font = 'bold 22px Arial'; g.fillText('Puntos: ' + Math.floor(score), 16, 36);
  g.textAlign = 'right'; g.fillText('Tiempo: ' + Math.max(0, Math.ceil(t)), W - 16, 36);
  g.textAlign = 'center'; if (combo > 1) { g.fillStyle = '#66c0f4'; g.fillText('Combo x' + combo, W / 2, 36); }
  if (st !== 'play') {
    g.fillStyle = '#000a'; g.fillRect(0, 0, W, H); g.fillStyle = '#fff'; g.font = 'bold 48px Arial';
    g.fillText(st === 'menu' ? 'CLICK RUSH' : 'FIN: ' + Math.floor(score) + ' pts', W / 2, H / 2 - 20);
    g.font = '20px Arial'; g.fillStyle = '#66c0f4'; g.fillText('Hola, ' + player + ' · Tu récord: ' + best, W / 2, H / 2 + 20);
    g.fillStyle = '#fff'; g.fillText('Click para ' + (st === 'menu' ? 'empezar' : 'jugar de nuevo'), W / 2, H / 2 + 60);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
